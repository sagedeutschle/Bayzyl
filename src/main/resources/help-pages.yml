pages:
  1:
    - "&a&lBayzyl &f| &6Page 1/16"
    - "&6/wand &f- &bGet the selection wand."
    - "&fRight click with the wand to set position 1. Left click sets position 2."
    - "&bPosition 1 & 2 mark opposite corners of a selection."
    - "&6/bzl &for &6/bayzyl &f— Main command root."
    - "&6/bzlhelp <page/topic>"
    - "&bTopics: &6Selection, Editing, Clipboard, Shapes, Brushes, Tools" 
    - "&6Cleanup, Palette, Nudge, Profiles, Kits, Runtime"
    - "&a&lImportant Definitions &f:" 
    - "&6'target' &fwill &f&lalways &frefers to the block your crosshair is pointed at."
    - "&6'selection' &fwill &f&lalways &frefers to the 3D box, outlined with the &6wand."
    - "&6Position 1 and 2 have aliases of&f: &bpos1 &fand &bpos2."
    - "&b'Live' usually refers to operations that happen outside of the clipboard."
  2:
    - "&a&lSelection &f| &6Page 2/16"
    - "&bA selection is a cuboid region you outline with the wand."
    - "&bMany commands only affect blocks inside the selection."
    - "&6/selcorners &f— Show's s<x,y,z> coordinates of pos1 & pos2."
    - "&6/selswap &f— Swap the locations of pos1 and pos2"
    - "&6/selsave <name> &f— Save the selected region to reload later."
    - "&6/selload <name> &bYou can only have one live selection at a time."
    - "&6/select cube <size> at:<player|target> &f—"
    - "Quickly create a selection at your current target or player location."
    - "&4When making a /select cube at:player, understand the selection expands out from you in all directions."
  3:
    - "&a&lSelection Tools &f| &6Page 3/16"
    - "&6/expand <amount> <direction> &f— Grow the selection outward."
    - "&6/contract <amount> <direction> &f— Shrink the selection inward."
    - "&6/expand all <amount> &f/ &6/contract all <amount> &f— Grow or shrink in every direction at once."
    - "&6/measure &f— Show dimensions and totals."
    - "&6/biomeinfo &f— Show which biomes the selection covers."
    - "&6/selcenter &f— Mark the exact center of the selection with particles."
    - "&6/redstoneaudit &f(or &6/bzl audit&f) &f— Rank likely wiring faults in the selected redstone. &6/redstoneaudit clear &fremoves the markers."
  4:
    - "&a&lVisuals &f& &aQuality of Life &f| &6Page 4/16"
    - "&bNifty tools to make life easier."
    - "&6/nightvision &f— Toggle's nightvision on and off."
    - "&6/ghosthand &f(or &6/gh&f) &f— Click through containers, buttons, and doors instead of using them."
    - "&6/unstick &f— Pop yourself out of a block if you're stuck."
    - "&6/unstick auto <on|off|status> &f— Auto-unstick whenever you get trapped."
    - "&6/ruler &f— Measure how far your |target| block is."
    - "&6/particlevisualtoggle &f— Show or hide particles around your selection."
    - "&6/bzl selectionparticles <on|off> &f— Same toggle, namespaced."
    - "&6/bzl selectionparticles color <COLOR> &f— Change selection particle color."
  5:
    - "&a&lNavigation &f| &6Page 5/16"
    - "&bFast ways to move around."
    - "&6/whereami &f— Ping your current coordinates and other helpful info."
    - "&6/surface &f— Pop up to the nearest open surface above you."
    - "&6/ascend &f— Move up to the next floor of a structure."
    - "&6/descend &f— Move down to the next floor below."
    - "&6/thru &f— Teleport through the wall you're looking at."
    - "&6/align <north|south|east|west> &f— Snap your facing to an exact direction."
    - "&6/ceil &f— Show how much headroom is above you."
    - "&6/centerme &f— Center yourself on the block you're standing on."
  6:
    - "&a&lEditing &f& &aRecovery &f| &6Page 6/16"
    - "&bThese commands edit your selection."
    - "&6/undo &f/ &6/redo &f— Step backward or forward through your edits."
    - "&6/set <BLOCK> &f— Fill the selection with one block mix."
    - "&6/replace <FROM> <TO> &f— Change every |FROM| block into |TO|."
    - "&6/walls <BLOCK> &f— Build only the four vertical walls of the selection."
    - "&6/overlay <BLOCK> &f— Lay one block on top of every solid surface inside the selection."
    - "&6/smooth &f— Soften jagged terrain inside the selection."
    - "&6/oops &f— Undo the last edit and broadcast that you did."
    - "&6/resume &f— Re-run a &6/copy &fthat a server restart interrupted."
    - "&bMask&f:<block,..> &f— The mask can be used on many functions to limit them to only effect certain blocks "
    - "(e.g. &6/set stone mask:dirt&f)."
  7:
    - "&a&lClipboard &f& &aTransformation &f| &6Page 7/16"
    - "&bIts copy and paste."
    - "&6/copy &f— Copy the current selection to your clipboard."
    - "&6/cut &f— Copy the selection and remove it from the world."
    - "&6/paste &f— Place your clipboard at your position."
    - "&bPaste has many useful flags: &6-a &fskips air blocks, &6-o &fpaste at copy/cut origin. "
    - "&6-n &fpreview only, &6-s &fMove's your selection to the paste. "
    - "&b/paste rotation:(...), &bRotation shortcut, does not alter the clipboard."
    - "&6/rotate <0/90/180/270/left/right/back> &f— Rotates the clipboard"
    - "&6/flip <x/y/z/left-right/front-back/up-down> &f— The clipboard does flips."
    - "&6/move <distance> [direction] &f— Move the selection zone+contents"
    - "&6/stack <count> [direction] &f— Repeat the selected build in a row. "
    - "&fDefaults to the direction you are facing."
    - "&6/clipboardinfo &f- Gives you the LxWxH and the location of the origin."
  8:
    - "&a&lFlags &f& &aAnchors &f| &6Page 8/16"
    - "&bFlags are short adjectives you can apply to commands to change how they behave."
    - "&bExample: &6/paste -a rotation:90"
    - "&&bPaste while skipping air blocks and rotate 90 degrees."
    - "&6-a &f— Removes destructive air blocks during paste."
    - "&6-n &f— Preview the change without applying it."
    - "&6-o &f— Paste exactly where the clipboard was copied."
    - "&6-s &f— Auto-select the pasted region."
    - "&6rotation:<0/90/180/270> &f— Rotate during paste."
    - "&bThe at: flag indicates where"
    - "&byour clipboard will be pasted at:&6<player/target/selection-center>"
    - "&bmask:<block,...> &f— Limit a command to only effecting specified blocks."
    - "&6confirm:true &f— Required for big or risky edits."
  9:
    - "&a&lShapes &f& &aFormula's &f| &6Page 9/16"
    - "&bShape commands build geometric shapes &6at: &bthe location you specify."
    - "&6/sphere <BLOCK> <radius> &f— Solid sphere."
    - "&6/hsphere <BLOCK> <radius> &f— Hollow sphere."
    - "&6/cyl <BLOCK> <radius> <height> &f— Solid cylinder."
    - "&6/hcyl <BLOCK> <radius> <height> &f— Hollow cylinder."
    - "&6/pyramid <BLOCK> <size> &f— Solid pyramid."
    - "&6/hpyramid <BLOCK> <size> &f— Hollow pyramid."
    - "&bUse &6at:<player/target/selection-center> &bto control how the shape is placed."
    - "&6--- Formula generation ---"
    - "&6/generate <BLOCK> <expression> &f— Fill a selection from a math formula. Aliases: &6/g  /gen"
    - "&6/generatebiome <BIOME> [shape|expression] &f— Sculpt biome volumes. Aliases: &6/genbiome  /gbiome"
  10:
    - "&a&lTools, &f& &aNature &f| &6Page 10/16"
    - "&6--- Nature ---"
    - "&6/naturalize [depth:<n>] &f— Turn a selected area into more natural terrain."
    - "&6/forestgen [size] [type] [density] at:<...>"
    - "&fGenerate a forest wherever you decide to put it &6at:"
    - "&6/pumpkins [size] at:<...> &f— Scatter a pumpkin patch."
    - "&6--- Tools ---"
    - "&6/eraser &f— Get the eraser tool."
    - "&6/eraser <radius> [mask] [surface] [selection] [carve]"
    - "&fMake a custom eraser."
    - "&6/bzl tool smooth/raise/lower/flatten &f— Terrain-shaping tool shortcuts."
    - "&6--- Cleanup & palette ---"
    - "&6/bzl cleanup <type> &f— Erase selection clutter or use a local cleanup eraser."
    - "&6/bzl palette analyze"
    - "&6/bzl palette swap <from> <to> &f— Inspect or swap the block mix in a selection."
  11:
    - "&a&lNudge &f| &6Page 11/16"
    - "&bNudge lets you slide your active selection by scrolling the mouse wheel."
    - "&bHow to use&f: &61) &fmake a selection  &62) &fhold the wand  &63) &fsneak  &64) &fface a direction  &65) &fscroll"
    - "&6/nudge status &f— Show your current nudge settings."
    - "&6/nudge step <amount> &f— How many blocks each scroll tick moves."
    - "&6/nudge invert <on|off> &f— Reverse scroll direction."
    - "&6/nudge vertical <jump|look|off> &f— Control vertical nudge behavior."
    - "&6/nudge reset &f— Restore defaults."
  12:
    - "&a&lProfiles &f& &aWorkflow Presets &f| &6Page 12/16"
    - "&bA profile saves your &f&lALL &bcurrent personal toggles, settings, and/or tools so you can quickly change setups for different tasks."
    - "&f&lThree types&f: &6config &f= your toggles and settings, &6toolbar &f= your Bayzyl hotbar tools, &6combined &f= both."
    - "&6/profile save <name> [type:config|toolbar|combined] [overwrite:true]"
    - "&6/profile update <name> [section:config|toolbar|all] &f— Save over an existing profile from your current state."
    - "&6/profile load <name> [section:config|toolbar|all] &f— Restore a saved profile."
    - "&6/profile inspect <name> &f— Preview what's inside a profile before loading it."
    - "&6/profile list &f| &6/profile rename <from> <to> &f| &6/profile duplicate <from> <to>"
    - "&6/profile delete <name> &f— Remove a saved profile."
    - "&bProfiles are personal to you, kits are all server wide."
  13:
    - "&a&lKits &f| &6Page 13/16"
    - "&bKits are public item sets."
    - "&6/kit <name> &f/ &6/kit load <name> &f— Load a kit into your inventory."
    - "&6/kitlist [page] &f— Browse kits by theme."
    - "&6/kit menu &f— Open the server kit menu."
    - "&6/kit inspect <name> &f— Preview a kit's contents and theme notes."
    - "&6/kitmake <hotbar|inventory> <name> [overwrite:true] &f— Save your current loadout as a new kit."
    - "&6/kit update <name> &for &6/kitupdate <name> &f— Refresh a kit from your current loadout."
    - "&6/kitconfirm &for &6/kit confirm &f— Confirm an update if Bayzyl warns about missing items."
    - "&6/kit rename <from> <to> &f| &6/kit duplicate <from> <to> &f— Manage variants."
    - "&6/kit note <name> <sentence...> &f| &6/kit theme <name> <theme...> &f— Edit kit metadata."
    - "&6/kit icon <name> <material|clear> &f| &6/kit alias <list|add|remove> ... &f— Customize the menu and shortcuts."
    - "&6/kit delete <name> &f| &6/kit restoredefaults &f— Remove kits or restore Bayzyl's defaults."
    - "&6/bzl <kitname> &fand sometimes &6/<kitname> &f— Direct shortcuts when the kit name is free."
    - "Deleted default kits can always be brought back with &6/kit restoredefaults&b."
  14:
    - "&a&lBrushes &f| &6Page 14/16"
    - "&bBrushes let you save, load, and bind reusable setups."
    - "&6/brush save <name> &f— Save the brush you are holding."
    - "&6/brush load <name> &f— Load a saved brush into your hand."
    - "&6/brush list &f— List saved brush presets."
    - "&6/brush delete <name> &f— Delete a saved brush preset."
    - "&6/brush info &f— Show what is bound to your held item."
    - "&6/brush none &f— Clear the brush from your held item."
    - "&6/brush clipboard &f(or &6/brush clip&f) &f— Bind your clipboard brush."
    - "&6/brush paint <block> [size:<n>] [density:<n>] [mask:<blocks>] &f— Bind a paint brush."
    - "&6/brush spatter <block> [size:<n>] [density:<n>] [mask:<blocks>] &f— Bind a spatter brush."
    - "&6/brush replace <from> <to> [size:<n>] [mask:<blocks>] &f— Bind a replace brush."
    - "&6/brush blend <block,block,...> [size:<n>] [density:<n>] [mask:<blocks>] &f— Bind a blend brush."
    - "&6/brush surface <block> [size:<n>] [density:<n>] [mask:<blocks>] &f— Bind a surface brush."
    - "&6/brush noise <block,block,...> [size:<n>] [density:<n>] [mask:<blocks>] &f— Bind a noise brush."
    - "&6/brush restore [size:<n>] [mask:<blocks>] &f— Bind a restore brush."
    - "&6/brush sphere <BLOCK> <radius> [mask:<blocks>] at:<...> &f— Bind a sphere brush."
    - "&6/brush hsphere <BLOCK> <radius> [mask:<blocks>] at:<...> &f— Bind a hollow sphere brush."
    - "&6/brush cyl <BLOCK> <radius> <height> [mask:<blocks>] at:<...> &f— Bind a cylinder brush."
    - "&6/brush hcyl <BLOCK> <radius> <height> [mask:<blocks>] at:<...> &f— Bind a hollow cylinder brush."
    - "&6/brush pyramid <BLOCK> <size> [mask:<blocks>] at:<...> &f— Bind a pyramid brush."
    - "&6/brush hpyramid <BLOCK> <size> [mask:<blocks>] at:<...> &f— Bind a hollow pyramid brush."
    - "&6/brush vegetation [palette] [size:<n>] [density:<n>] [mask:<blocks>] &f— Bind a vegetation brush."
    - "&6/brush decay [block] [size:<n>] [density:<n>] [mask:<blocks>] &f— Bind a decay brush."
  15:
    - "&a&lBrushes &f| &6Page 15/16"
    - "&bThese brush types use your selection, target, or block choice to shape terrain."
    - "&6/brush erase <radius> [r:<n>] [mask:<blocks>] [surface:on|off] [selection:only] [carve:on|off] [bedrock:on|off] &f— Bind an eraser brush."
    - "&6/brush smooth <radius> [iterations|power] [bedrock:on|off] &f— Bind a smoothing brush."
    - "&6/brush raise <radius> [strength] [bedrock:on|off] &f— Raise terrain."
    - "&6/brush lower <radius> [strength] [bedrock:on|off] &f— Lower terrain."
    - "&6/brush flatten <radius> [strength] [bedrock:on|off] &f— Flatten terrain."
    - "&6/brush naturalize <radius> [depth|power] [bedrock:on|off] &f— Naturalize terrain."
    - "&6/brush floatingcleanup <radius> [reach] &f— Clear floating blocks."
    - "&6/brush foliagecleanup <radius> [aggression] &f— Trim foliage."
    - "&6/brush liquidcleanup <radius> [depth] &f— Clear liquids."
    - "&6/brush snowcleanup <radius> [aggression] &f— Remove snow."
    - "&6/brush lightcleanup <radius> [reach] &f— Remove light spam."
    - "&6/mask <blocks|none> &f— Set the mask of the brush in your hand."
    - "&6/material <block|distribution> &f— Change the block mix of the brush in your hand."
    - "&6/size <radius> [height] &f— Change brush size."
    - "&6/density <0.0-1.0> &f— Change brush density."
    - "&6/none &f— Clear the brush from your hand."
  16:
    - "&a&lTab Menu &f& &aRuntime &f| &6Page 16/16"
    - "&bThe tab menu an info panel that appears when you hold tab."
    - "&6/tabmenu status &f— Show which tab modules are on."
    - "&6/tabmenu off &f— Turn off all tab menu modules."
    - "&6/tabmenu all <on|off|status> &f— Turn all module's on or off"
    - "&6/tabmenu ram <on|off|status> &f— Live server memory report."
    - "&6/tabmenu clipboard <on|off|status> &f— Clipboard panel."
    - "&6/tabmenu selection <on|off|status> &f— Selection panel."
    - "&6/tabmenu trail <on/off/status/count> &f— Edit history panel."
    - "&6/bzltoggle admin &f— Skip confirmation prompts for yourself."
    - "&6/bzltoggle ramalert &f— Quick-toggle the memory alert system."
    - "&6/bzl env history <count> &f— Set how many steps are kept in memory to undo/redo."
    - "&bBackends: &fEdit &f= %EDIT_BACKEND%  &b| &fShapes &f= %SHAPE_BACKEND%"
  17:
    - "&a&lUnsorted &f& &aNew Commands &f| &6Page 17"
    - "&bShortcut commands and tweaks that haven't been folded into the main help yet."
    - "&6--- Top-level shortcuts ---"
    - "&6/accent <color|reset|status|#RRGGBB> &f— Set the Bayzyl menu accent color. Same as &6/bzl env accent&f."
    - "&6/memreset [global] &f— Clear your clipboard, undo/redo, and recent edit trail. &6global &fneeds admin."
    - "&6/authority <status|claim|giveup> &f— Bayzyl command authority control. Same as &6/bzl authority&f."
    - "&6/tool <smooth|raise|lower|flatten> <radius> [power] [bedrock:on|off] &f— Bind a Bayzyl terrain tool. Same as &6/bzl tool&f."
    - "&6--- Cleanup shortcuts ---"
    - "&6/floatingcleanup [confirm:true] &f— Wipe orphan floating blocks in your selection."
    - "&6/foliagecleanup [confirm:true] &f— Wipe leaves and grass in your selection."
    - "&6/liquidcleanup [confirm:true] &f— Wipe water and lava in your selection."
    - "&6/snowcleanup [confirm:true] &f— Wipe snow layers in your selection."
    - "&6/lightcleanup [confirm:true] &f— Wipe redundant light blocks in your selection."
    - "&bAll cleanup shortcuts are equivalent to &6/cleanup <type>&b."
