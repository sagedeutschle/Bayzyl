# prismet.xyz: build, verify and gate the site on every push that touches it; deploy it to Fly from main.
#
# Secrets (repository settings → Secrets and variables → Actions):
#   FLY_API_TOKEN          required for the deploy job (a deploy token for the app is enough)
#   PRISMET_PRIVATE_WORDS  optional, comma-separated words that must never appear in the built site (host names etc.)
#
# An edit saved from prismet.xyz/edit (or any commit to main under showcase/) is live about three minutes later.
# Roll back by reverting the commit on GitHub; the workflow redeploys the previous content.
name: site

on:
  push:
    paths: ['showcase/**', '.github/workflows/site.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Fly after the build (any branch)'
        type: boolean
        default: false

permissions:
  contents: read

# One group per branch: a push to a branch supersedes that branch's queued run, and nothing can cancel a run on main
# (deploys stay serialised because they all run in main's group).
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build, verify, gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - name: Build the site (verify.mjs runs at the end and fails the build on any problem)
        env:
          PRISMET_PRIVATE_WORDS: ${{ secrets.PRISMET_PRIVATE_WORDS }}
        run: node showcase/prismet-site/build.mjs
      - name: The edit page reads and writes the content files exactly as the build does
        run: node showcase/tools/tests/edit-check.mjs
      - name: Uncle Scam's arithmetic and data (/scam)
        run: |
          node showcase/tools/tests/scam-check.mjs
          node showcase/tools/tests/scam-bundle-check.mjs
          node showcase/tools/tests/scam-local-ui-check.mjs
      - name: Start the live server locally with this build and gate every route
        env:
          GATE_WORDLE: require
        run: |
          cd showcase/server
          npm ci --omit=dev
          rm -rf site && cp -r ../prismet-site/dist site
          (PORT=18081 node server.js > /tmp/server.log 2>&1 &)
          for i in $(seq 1 100); do curl -sf -o /dev/null http://127.0.0.1:18081/healthz && break; sleep 0.2; done
          ../tools/deploy/gate.sh http://127.0.0.1:18081 local || { cat /tmp/server.log; exit 1; }
      - name: Product hub rules, saves, APIs, data and route regressions (blocking)
        run: |
          node showcase/tools/tests/portfolio-check.mjs
          node showcase/tools/tests/portfolio-stories-check.mjs
          node showcase/tools/tests/arcade-check.mjs
          node showcase/tools/tests/arcade-library-check.mjs
          node showcase/tools/tests/arcade-shell-check.mjs
          node showcase/tools/tests/arcade-room-lifecycle-check.mjs
          node showcase/tools/tests/arcade-api-check.mjs
          node showcase/tools/tests/board-games-check.mjs
          node showcase/tools/tests/card-workshop-check.mjs
          node showcase/tools/tests/puzzle-games-check.mjs
          node showcase/tools/tests/catan-check.mjs
          node showcase/tools/tests/debt-check.mjs
          node showcase/tools/tests/debt-headline-check.mjs
          node showcase/tools/tests/financial-data-check.mjs
          node showcase/tools/tests/debt-discovery-check.mjs
          node showcase/tools/tests/financial-routes-check.mjs
          node showcase/tools/tests/scam-routes-check.mjs
          node showcase/tools/tests/signaling-check.mjs
          node showcase/tools/tests/product-routes-check.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: showcase/prismet-site/dist
          # The reviewed .well-known association document is required for app links.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  browser-check:
    name: Browser checks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: dist, path: showcase/prismet-site/dist }
      - name: Install Playwright's Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Install the server's dependency (edit-smoke starts the real server)
        run: cd showcase/server && npm ci --omit=dev
      - name: site-check.mjs (44 checks at 1440 and 390) and edit-smoke.mjs (the editor against the real server)
        run: |
          export CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node showcase/tools/tests/site-check.mjs
          node showcase/tools/tests/edit-smoke.mjs

  deploy:
    name: Deploy to Fly
    needs: [build, browser-check]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: prismet-site-restless-horizon-217
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: dist, path: showcase/prismet-site/dist }
      - name: Refuse to deploy without a Fly token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions, then re-run."; exit 1; fi
      - name: Assemble the overlay (server.js + site/ + scrubbed public/ + whiteouts)
        run: |
          test -f showcase/prismet-site/dist/.well-known/apple-app-site-association
          showcase/tools/deploy/assemble-overlay.sh /tmp/overlay
      - name: Push the image (the v13 base plus one layer)
        id: push
        run: |
          TAG="site-${{ github.run_number }}-$(echo "${{ github.sha }}" | cut -c1-7)"
          IMAGE=$(python3 showcase/tools/deploy/push-overlay.py /tmp/overlay "$TAG" | tail -1)
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE"
      - name: Install flyctl
        run: |
          curl -sSL https://fly.io/install.sh | sh -s -- --non-interactive
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Sync the editor's secrets to Fly (EDIT_GITHUB_TOKEN, EDIT_PIN; staged, applied by the deploy below)
        env:
          EDIT_GITHUB_TOKEN: ${{ secrets.EDIT_GITHUB_TOKEN }}
          EDIT_PIN: ${{ secrets.EDIT_PIN }}
          EDIT_DRAFT_REPO: ${{ secrets.EDIT_DRAFT_REPO }}     # optional: owner/name of the private drafts repository
          EDIT_DRAFT_TOKEN: ${{ secrets.EDIT_DRAFT_TOKEN }}   # optional: only when the main token cannot write there
        run: |
          args=()
          [ -n "$EDIT_GITHUB_TOKEN" ] && args+=("EDIT_GITHUB_TOKEN=$EDIT_GITHUB_TOKEN")
          [ -n "$EDIT_PIN" ] && args+=("EDIT_PIN=$EDIT_PIN")
          [ -n "$EDIT_DRAFT_REPO" ] && args+=("EDIT_DRAFT_REPO=$EDIT_DRAFT_REPO")
          [ -n "$EDIT_DRAFT_TOKEN" ] && args+=("EDIT_DRAFT_TOKEN=$EDIT_DRAFT_TOKEN")
          if [ ${#args[@]} -eq 0 ]; then echo "No EDIT_GITHUB_TOKEN / EDIT_PIN secrets set; the edit page stays locked out until they exist."; exit 0; fi
          [ -n "$EDIT_PIN" ] && [ ${#EDIT_PIN} -lt 6 ] && { echo "::error::EDIT_PIN must be at least 6 characters."; exit 1; }
          fly secrets set --stage -a "$APP" "${args[@]}" || echo "::warning::Could not stage the editor's secrets (does the Fly token allow secrets?); the deploy continues."
      - name: Deploy with the app's own fly.toml (never a minimal one; see showcase/HANDOFF.md, the v19 incident)
        working-directory: showcase/tools/deploy
        run: fly deploy --image "${{ steps.push.outputs.image }}" -a "$APP" --strategy rolling
      - name: Gate the live site
        run: showcase/tools/deploy/gate.sh https://prismet.xyz live
