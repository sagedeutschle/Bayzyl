plugins {
    id 'java'
}

group = 'com.bayzyl'
version = '0.2.0-alpha.2'

/**
 * Short commit of HEAD, with "-dirty" when a plugin build input has uncommitted changes, or "unknown" without
 * git. A ValueSource so the configuration cache re-checks it on every build. Only plugin inputs count: website
 * edits under showcase/ must not mark the jar dirty.
 */
abstract class GitRevision implements ValueSource<String, GitRevision.Params> {
    static final String[] PLUGIN_INPUTS = ['src', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle', 'gradlew', 'scripts']

    interface Params extends ValueSourceParameters {
        DirectoryProperty getProjectDir()
    }

    @javax.inject.Inject
    abstract ExecOperations getExecOperations()

    @Override
    String obtain() {
        File dir = parameters.projectDir.get().asFile
        String head = run(dir, 'git', 'rev-parse', '--short=12', 'HEAD')
        if (!head) {
            return 'unknown'
        }
        return run(dir, 'git', 'status', '--porcelain', '--', *PLUGIN_INPUTS) ? head + '-dirty' : head
    }

    private String run(File dir, String... command) {
        try {
            def out = new ByteArrayOutputStream()
            def result = execOperations.exec { spec ->
                spec.workingDir = dir
                spec.commandLine(command)
                spec.standardOutput = out
                spec.errorOutput = new ByteArrayOutputStream()
                spec.ignoreExitValue = true
            }
            return result.exitValue == 0 ? out.toString().trim() : ''
        } catch (Exception ignored) {
            return ''
        }
    }
}

def bayzylRevision = providers.gradleProperty('bayzyl.revision')
        .orElse(providers.of(GitRevision) { parameters.projectDir.set(layout.projectDirectory) })

def targetJavaVersion = 21
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://maven.enginehub.org/repo/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.4.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def pluginVersion = project.version.toString()
    inputs.property('version', pluginVersion)
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

tasks.jar {
    archiveBaseName = 'bayzyl'
    // Reproducible: no file timestamps, stable entry order, and no wall-clock time in the manifest.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes(
                'Implementation-Title': 'Bayzyl',
                'Implementation-Version': project.version.toString(),
                'Bayzyl-Revision': bayzylRevision.get())
    }
}

tasks.test {
    useJUnitPlatform()
    // Metadata and reproducibility tests inspect the real jar, never a stale one.
    dependsOn tasks.jar
    systemProperty 'bayzyl.jar', tasks.jar.archiveFile.get().asFile.absolutePath
}
