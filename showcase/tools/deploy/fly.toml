app = "prismet-site-restless-horizon-217"
primary_region = "iad"

[env]
  PORT = "8080"
  GITHUB_USER = "sagedeutschle"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
