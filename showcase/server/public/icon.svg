<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4a35"/>
      <stop offset="1" stop-color="#07261c"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background so it also works as a maskable icon -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- subtle upward trend line -->
  <polyline points="92,360 200,300 300,330 430,150"
            fill="none" stroke="#3f7d63" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <!-- the dollar mark -->
  <text x="256" y="332" font-size="300" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="700" fill="#7ef0b8">$</text>
</svg>
