<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a99bff"/>
      <stop offset="0.28" stop-color="#71e1d0"/>
      <stop offset="0.55" stop-color="#e6bd68"/>
      <stop offset="0.8" stop-color="#ff8177"/>
      <stop offset="1" stop-color="#a99bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#a99bff" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#71e1d0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prismFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#c9c2ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#71e1d0" stop-opacity="0.24"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0a0a0c"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- top spectrum rule -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#spectrum)"/>

  <!-- ===== prism motif (right) ===== -->
  <!-- incoming white beam -->
  <line x1="690" y1="330" x2="915" y2="322" stroke="#f3efe7" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <line x1="690" y1="330" x2="915" y2="322" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.12"/>

  <!-- dispersed spectrum rays -->
  <line x1="1010" y1="322" x2="1200" y2="232" stroke="#a99bff" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
  <line x1="1010" y1="322" x2="1200" y2="292" stroke="#71e1d0" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
  <line x1="1010" y1="322" x2="1200" y2="352" stroke="#e6bd68" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
  <line x1="1010" y1="322" x2="1200" y2="412" stroke="#ff8177" stroke-width="6" stroke-linecap="round" opacity="0.92"/>

  <!-- prism triangle -->
  <polygon points="965,192 878,438 1058,438" fill="url(#prismFace)" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" opacity="1"/>

  <!-- ===== text block (left) ===== -->
  <text x="92" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="6" fill="#71e1d0">PRISMATIC STUDIO</text>

  <text x="86" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="150" font-weight="bold" letter-spacing="-5" fill="#f3efe7">prismet</text>

  <text x="92" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="normal" fill="#bbb6ad">Independent software, games, tools,</text>
  <text x="92" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="normal" fill="#bbb6ad">and strange little systems.</text>

  <!-- bottom row -->
  <rect x="92" y="520" width="46" height="4" fill="url(#spectrum)"/>
  <text x="92" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#f3efe7">prismet.xyz</text>
  <text x="300" y="562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a8a29a">Apple · Web · Desktop</text>
</svg>
