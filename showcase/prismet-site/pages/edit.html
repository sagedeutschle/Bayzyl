<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Edit · Prismet</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="edit.css">
<script type="module" src="edit.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" title="Back to the site"><strong>Prismet</strong><span>Editor</span></a>
  <label class="sr-only" for="page">Page</label>
  <select id="page" class="page" disabled></select>
  <div class="seg" role="group" aria-label="History">
    <button id="undo" type="button" title="Undo (⌘Z)" aria-label="Undo" disabled>↶</button>
    <button id="redo" type="button" title="Redo (⇧⌘Z)" aria-label="Redo" disabled>↷</button>
  </div>
  <div class="seg" id="device" role="group" aria-label="Preview width">
    <button type="button" data-w="1440" aria-pressed="true">Desktop</button>
    <button type="button" data-w="820" aria-pressed="false">Tablet</button>
    <button type="button" data-w="390" aria-pressed="false">Mobile</button>
  </div>
  <label class="width"><span class="sr-only">Custom width in pixels</span><input id="width" type="number" min="280" max="2560" step="10" placeholder="width" inputmode="numeric"><span>px</span></label>
  <label class="sr-only" for="zoom">Zoom</label>
  <select id="zoom" class="zoom"><option value="fit">Fit</option><option value="100">100%</option><option value="75">75%</option><option value="50">50%</option></select>
  <span class="grow"></span>
  <span id="draft" class="draft" role="status" aria-live="polite"></span>
  <div class="seg" id="mode" role="group" aria-label="Mode">
    <button type="button" data-mode="edit" aria-pressed="true">Edit</button>
    <button type="button" data-mode="preview" aria-pressed="false">Preview</button>
  </div>
  <a id="live" class="btn" href="index.html" target="_blank" rel="noopener">Live site</a>
  <button id="save" class="btn primary" type="button" disabled>Nothing to publish</button>
  <button id="lock" class="btn" type="button" title="End this session">Lock</button>
</header>

<aside class="left" aria-label="Site structure">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="site" aria-selected="true">Site</button>
    <button type="button" role="tab" data-tab="design" aria-selected="false">Design</button>
    <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
    <button type="button" id="find" class="find" title="Search and commands (⌘K)">⌘K</button>
  </div>
  <div id="tree" class="tree" role="tree"></div>
</aside>

<main id="stage" class="stage"><iframe id="frame" title="Preview of the site"></iframe></main>

<aside class="right" aria-label="Inspector"><div id="inspector" class="inspector"></div></aside>

<footer class="foot">
  <nav id="crumbs" class="crumbs" aria-label="Selection"></nav>
  <span class="grow"></span>
  <span id="deploy" class="deploy" role="status" aria-live="polite"></span>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</footer>

<section id="connect" class="connect" hidden>
  <form id="pin-form">
    <h1>Prismet Editor</h1>
    <p>Enter the PIN to open an eight-hour session in this browser. The token that writes to the site stays on the server. Branch: <code id="branch">main</code>.</p>
    <label for="pin">PIN</label>
    <input id="pin" type="password" autocomplete="off" spellcheck="false" placeholder="••••••">
    <button class="btn primary" type="submit">Unlock</button>
    <p id="pin-status" class="status" role="status" aria-live="polite"></p>
  </form>
</section>

<div id="palette" class="palette" hidden>
  <div class="palette-box" role="dialog" aria-label="Search and commands">
    <input id="palette-input" type="text" autocomplete="off" spellcheck="false" placeholder="Search pages, records, words, tokens, commands…" aria-controls="palette-list">
    <ul id="palette-list" role="listbox"></ul>
  </div>
</div>
</body>
</html>
